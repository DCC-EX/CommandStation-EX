; Experimental - Ethernet beta test
;
[env:Nucleo-F429ZI]
platform = ststm32 @ 19.0.0
board = nucleo_f429zi
framework = arduino
lib_deps = ${env.lib_deps}
			stm32duino/STM32Ethernet @ ^1.4.0
; for test only         https://github.com/habazut/lwip#stm32
			stm32duino/STM32duino LwIP @ ^2.1.3
lib_ignore = WiFi101
			WiFi101_Generic
			WiFiEspAT
			WiFiMulti_Generic
			WiFiNINA_Generic
build_flags = -std=c++17 -Os -g2 ${env.build_flags} -DCUSTOM_PERIPHERAL_PINS
monitor_speed = 115200
monitor_echo = yes
upload_protocol = stlink

