; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = 
	CSB1
	Nucleo-F411RE
	Nucleo-F446RE
	Nucleo-F429ZI
src_dir = .
include_dir = .
extra_configs = myPlatformio.ini
core_dir = ./.pio ; pull packages and platforms to local .pio directory along libdeps
# Force all environments in this project to share these folders
packages_dir = .pio/shared_packages
cache_dir = .pio/shared_cache

[env]
build_flags = -Wall -Wextra -std=c++17 
; monitor_filters = time

[ESP32-common]
; description = ESP32 with IDF v4/5 and Arduino framework
; Work around a bug in platformio, see comment in that file
extra_scripts = pre:platformio_custom.py
board = esp32dev
framework = arduino
build_flags = ${env.build_flags}
monitor_speed = 115200
monitor_echo = yes
lib_deps = 
    arduino-libraries/Ethernet

[ESP32-IDF4]
; description = ESP32 with IDF v4 and Arduino framework
extends = ESP32-common
; Lock version to 6.7.0 as that is
; Arduino v2.0.16 (based on IDF v4.4.7)
; which is the latest version based
; on IDF v4. We can not use IDF v5.
platform = espressif32 @ 6.7.0
; platform_packages =
;                     framework-arduinoespressif32 @ 3.20016.0
;                     tool-esptoolpy @ 1.40501.0
;                     toolchain-xtensa-esp32 @ 8.4.0+2021r2-patch5
build_flags = ${env.build_flags}
 
[ESP32-IDF5]
; description = ESP32 with IDF v5 and Arduino framework
extends = ESP32-common
platform = https://github.com/pioarduino/platform-espressif32.git
; Native USB Configuration (Essential for C5 USB-CDC support)
build_flags = ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
	-DDCCEX_NODE

; IDF5  cpus are not command stations so they can use other libraries without conflicts
lib_deps =
    arduino-libraries/Ethernet
	adafruit/Adafruit GFX Library
	adafruit/Adafruit ST7735 and ST7789 Library

; Override this if using a custom partition table (e.g., for Zigbee)
; board_build.partitions = default.csv

[env:CSB1]
; description = EX CSB1 Command Station
extends = ESP32-IDF4
build_flags = ${env.build_flags} -DMOTOR_SHIELD_OVERRIDE=EXCSB1

[env:CSB1-4Tracks]
; description = EX CSB1 with added EX8874 Command Station
extends = ESP32-IDF4
build_flags = ${env.build_flags} -DMOTOR_SHIELD_OVERRIDE=EXCSB1_WITH_EX8874

[env:ESP32-CS]
; description = ESP32 based Command Station
extends = ESP32-IDF4

[env:ESP32-NODE]
; description = ESP32 based DCCEX Node
extends = ESP32-IDF5
board = esp32dev
build_flags = ${env.build_flags} -DDCCEX_NODE

[env:matouch_esp32c3]
extends = ESP32-IDF5
board = esp32-c3-devkitm-1  ; Change this if you have a different C3 board
board_build.partitions = partitions_4MB_ota.csv  ; Use a custom partition table if needed
; additional I2C flags needed
build_flags = ${ESP32-IDF5.build_flags}
    -DI2C_SDA=2
	-DI2C_SCL=3

[env:esp32c5]
extends = ESP32-IDF5
board = esp32-c5-devkitc1-n16r4

[env:esp32c6]
extends = ESP32-IDF5
board = esp32-c6-devkitm-1

[env:waveshare_esp32_s3_audio]
extends = ESP32-IDF5
board = esp32-s3-devkitc-1 ; changed from esp32-s3-devkitc1-n16r8 as that could not be found any more

; Board-specific settings (ESP32-S3 with 16MB Flash, 8MB PSRAM)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv

lib_deps = 
    ${ESP32-IDF5.lib_deps}
    https://github.com/greiman/SdFat.git
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/arduino-audio-driver.git
    https://github.com/pschatzmann/arduino-libhelix.git
	Adafruit/Adafruit NeoPixel @ ^1.10.6

; Build flags for PSRAM and partition support
build_flags =
    ${ESP32-IDF5.build_flags}
    -DSD_CHIP_SELECT_MODE=1
    -DBOARD_HAS_PSRAM
	-DI2C_SDA=11
	-DI2C_SCL=10
    -mfix-esp32-psram-cache-issue

; Specify upload and monitor flags, (TODO Are these needed?) 
upload_speed = 921600
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder, default

[env:elecrow_esp32_s3_5inch]
extends = ESP32-IDF5
board = esp32-s3-devkitc-1

; Board-specific settings (ESP32-S3 with 4MB Flash, 8MB PSRAM)
; board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.flash_mode = qio
board_build.psram = enabled
board_build.arduino.memory_type = qio_opi
board_build.partitions = default.csv

; Build flags for PSRAM and partition support
build_flags =
    $(env.build_flags)   ; avoid the USB mode defaults 
    -DBOARD_HAS_PSRAM
	-DDCCEX_NODE
    -mfix-esp32-psram-cache-issue
	-DI2C_USE_WIRE
	-DI2C_SDA=19
	-DI2C_SCL=20

upload_speed = 460800



; ============= NUCLEO SECTION =========================

[Nucleo-Base]
; Base environment for Nucleo boards
platform = ststm32 @ 19.7.1
platform_packages = framework-arduinoststm32@https://github.com/stm32duino/Arduino_Core_STM32.git#2.12.0
framework = arduino
lib_deps = 
    arduino-libraries/Ethernet @ ^2.0.2
lib_ignore = WiFi101
			WiFi101_Generic
			WiFiEspAT
			WiFiMulti_Generic
			WiFiNINA_Generic
build_flags = -std=c++17 -Os -g2 ${env.build_flags} -I.
monitor_speed = 115200
monitor_echo = yes
upload_protocol = stlink

[env:Nucleo-F411RE]
extends = Nucleo-Base
board = nucleo_f411re

[env:Nucleo-F446RE]
extends = Nucleo-Base
board = nucleo_f446re

[env:Nucleo-F401RE]
extends = Nucleo-Base
board = nucleo_f401re

[env:Nucleo-F446ZE]
extends = Nucleo-Base
board = nucleo_f446ze

[env:Nucleo-F429ZI]
extends = Nucleo-Base
board = nucleo_f429zi
build_flags = ${Nucleo-Base.build_flags} -DCUSTOM_PERIPHERAL_PINS
; This replaces the default Ethernet library with the STM32Ethernet library for the Nucleo-F429ZI board.
lib_deps =
    stm32duino/STM32Ethernet @ ^1.4.0
    stm32duino/STM32duino LwIP @ ^2.2.1

[env:Nucleo-F439ZI]
extends = env:Nucleo-F429ZI
board = nucleo_f439zi
