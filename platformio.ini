; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = 
	mega2560
	ESP32
	Nucleo-F411RE
	Nucleo-F446RE
	Nucleo-F429ZI
src_dir = .
include_dir = .

[env]
build_flags = -Wall -Wextra
; monitor_filters = time

[env:mega2560-debug]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = 
	${env.lib_deps}
	arduino-libraries/Ethernet
	SPI
monitor_speed = 115200
monitor_echo = yes
build_flags = -DDIAG_IO=2 -DDIAG_LOOPTIMES ${env.build_flags}

[env:mega2560-I2C-wire]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = 
	${env.lib_deps}
	arduino-libraries/Ethernet
	SPI
monitor_speed = 115200
monitor_echo = yes
build_flags = -DI2C_USE_WIRE ${env.build_flags}

[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = 
	${env.lib_deps}
	arduino-libraries/Ethernet
	SPI

lib_ignore = WiFi101
			WiFi101_Generic
			WiFiEspAT
			WiFiMulti_Generic
			WiFiNINA_Generic

monitor_speed = 115200
monitor_echo = yes
build_flags = ${env.build_flags}

[env:mega2560-eth]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = 
    ${env.lib_deps}
    arduino-libraries/Ethernet
    SPI
lib_ignore = WiFi101
            WiFi101_Generic
            WiFiEspAT
            WiFiMulti_Generic
            WiFiNINA_Generic
monitor_speed = 115200
monitor_echo = yes
build_flags = ${env.build_flags}

[env:ESP32]
; Lock version to 6.7.0 as that is
; Arduino v2.0.16 (based on IDF v4.4.7)
; which is the latest version based
; on IDF v4. We can not use IDF v5.
platform = espressif32 @ 6.7.0
board = esp32dev
framework = arduino
lib_deps =
	${env.lib_deps}
	adafruit/Adafruit GFX Library
	adafruit/Adafruit ST7735 and ST7789 Library
build_flags = -std=c++17 ${env.build_flags}
monitor_speed = 115200
monitor_echo = yes

[env:ESP32-NODE]
; Lock version to 6.7.0 as that is
; Arduino v2.0.16 (based on IDF v4.4.7)
; which is the latest version based
; on IDF v4. We can not use IDF v5.
platform = espressif32 @ 6.7.0
board = esp32dev
framework = arduino
lib_deps = ${env.lib_deps}
	adafruit/Adafruit GFX Library
	adafruit/Adafruit ST7735 and ST7789 Library
build_flags = -std=c++17 ${env.build_flags} -DDCCEX_NODE
monitor_speed = 115200
monitor_echo = yes

[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitm-1  ; Change this if you have a different C6 board
framework = arduino

; Serial Monitor Options
monitor_speed = 115200

; Native USB Configuration (Essential for C6 USB-CDC support)
build_flags = 
    -std=c++17 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Optional: Uncomment if using a custom partition table (e.g., for Zigbee)
; board_build.partitions = default.csv

[env:esp32c5]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-c5-devkitc1-n16r4  ; Change this if you have a different C5 board
framework = arduino

; Serial Monitor Options
monitor_speed = 115200
monitor_echo = yes

; Native USB Configuration (Essential for C5 USB-CDC support)
build_flags = 
    -std=c++17 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
	-DDCCEX_NODE

; Optional: Uncomment if using a custom partition table (e.g., for Zigbee)
; board_build.partitions = default.csv

[env:matouch_esp32c3]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-c3-devkitm-1  ; Change this if you have a different C3 board
framework = arduino

; Serial Monitor Options
monitor_speed = 115200
monitor_echo = yes

; Native USB Configuration (Essential for C3 USB-CDC support)
build_flags = 
    -std=c++17 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
	-DDCCEX_NODE
	-DI2C_SDA=2
	-DI2C_SCL=3

; Optional: Uncomment if using a custom partition table (e.g., for Zigbee)
; board_build.partitions = default.csv

[env:waveshare_esp32_s3_audio]
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
platform = espressif32
framework = arduino	
board = esp32-s3-devkitc1-n16r8

; Board-specific settings (ESP32-S3 with 16MB Flash, 8MB PSRAM)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv

lib_deps = 
    https://github.com/greiman/SdFat.git
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/arduino-audio-driver.git
    https://github.com/pschatzmann/arduino-libhelix.git
	

; Build flags for PSRAM and partition support
build_flags =
    -std=c++17 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
	-DDCCEX_NODE
	-DI2C_SDA=11
	-DI2C_SCL=10
    -mfix-esp32-psram-cache-issue

; Specify upload and monitor speed
upload_speed = 921600
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder, default

[env:elecrow_esp32_s3_5inch]
platform = https://github.com/pioarduino/platform-espressif32.git
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
; platform = espressif32
framework = arduino	
board = esp32-s3-devkitc-1

; Board-specific settings (ESP32-S3 with 4MB Flash, 8MB PSRAM)
; board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.flash_mode = qio
board_build.psram = enabled
board_build.arduino.memory_type = qio_opi
board_build.partitions = default.csv

; Build flags for PSRAM and partition support
build_flags =
    -std=c++17 
    ; -DARDUINO_USB_MODE=1
    ; -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
	-DDCCEX_NODE
    -mfix-esp32-psram-cache-issue
	-DI2C_USE_WIRE
	-DI2C_SDA=19
	-DI2C_SCL=20

; Specify upload and monitor speed
upload_speed = 460800
monitor_speed = 115200
monitor_echo = yes
; monitor_dtr = 0
; monitor_rts = 0
; monitor_filters = esp32_exception_decoder, default

[env:Nucleo-F411RE]
platform = ststm32 @ 19.0.0
board = nucleo_f411re
framework = arduino
lib_deps = ${env.lib_deps}
build_flags = -std=c++17  -Os -g2 ${env.build_flags}
monitor_speed = 115200
monitor_echo = yes

