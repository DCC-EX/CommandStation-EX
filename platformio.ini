lib_ignore = WiFi101
			WiFi101_Generic
			WiFiEspAT
			WiFiMulti_Generic
			WiFiNINA_Generic
build_flags = -std=c++17 -Os -g2 ${env.build_flags} -DCUSTOM_PERIPHERAL_PINS
monitor_speed = 115200
monitor_echo = yes
